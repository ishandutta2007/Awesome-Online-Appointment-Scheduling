<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="50%" stop-color="#0f1b3b"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-badge {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-badge-delayed {
        animation: float 7s ease-in-out 1.5s infinite alternate;
      }
      .glow-wave {
        animation: waveAnim 8s linear infinite;
      }
      .shimmer {
        animation: shimmer 3s infinite linear;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.35; }
        100% { transform: scale(1.08); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes waveAnim {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1000; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)"/>

  <!-- Dynamic Ambient Animated Background Glows -->
  <g opacity="0.45" style="mix-blend-mode: screen;">
    <circle cx="180" cy="110" r="140" fill="#3b82f6" filter="url(#glow)" class="pulse-circle" style="transform-origin: 180px 110px;"/>
    <circle cx="1020" cy="220" r="150" fill="#a855f7" filter="url(#glow)" class="pulse-circle" style="transform-origin: 1020px 220px; animation-duration: 5s;"/>
    <circle cx="600" cy="40" r="110" fill="#06b6d4" filter="url(#glow)" class="pulse-circle" style="transform-origin: 600px 40px; animation-duration: 6s;"/>
  </g>

  <!-- Subtle Animated Grid Lines in Background -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Background Animated Decorative Flow Wave -->
  <path d="M -50 310 Q 300 240, 600 310 T 1250 260" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.4" class="glow-wave"/>
  <path d="M -50 80 Q 350 160, 750 70 T 1250 120" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" class="glow-wave" style="animation-direction: reverse; animation-duration: 10s;"/>

  <!-- Left Dynamic Decorative Badge (Kept safely off-center) -->
  <g class="float-badge" style="transform-origin: 100px 100px;">
    <rect x="50" y="80" width="130" height="58" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="75" cy="109" r="10" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M71 109 L74 112 L79 106" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="96" y="103" fill="#94a3b8" font-size="11" font-weight="600">CONFIRMED</text>
    <text x="96" y="119" fill="#f8fafc" font-size="12" font-weight="700">10:00 AM</text>
  </g>

  <!-- Right Dynamic Decorative Badge (Kept safely off-center) -->
  <g class="float-badge-delayed" style="transform-origin: 1080px 140px;">
    <rect x="1010" y="110" width="140" height="58" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="1035" cy="139" r="10" fill="#a855f7" fill-opacity="0.2"/>
    <circle cx="1035" cy="139" r="4" fill="#c084fc"/>
    <text x="1056" y="133" fill="#cbd5e1" font-size="11" font-weight="600">CALENDAR</text>
    <text x="1056" y="149" fill="#f8fafc" font-size="12" font-weight="700">Auto-Synced</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Icon, Title, Subtitle, Feature Badges (Always in prominent foreground) -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="-118" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-105" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED AWESOME LIST</text>
      <text x="75" y="5" fill="#94a3b8" font-size="12" font-weight="500">🗓️ 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="140" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.8">
      Awesome Online Appointment Scheduling
    </text>

    <!-- Subtitle with Glowing Accent Gradient -->
    <text x="600" y="180" text-anchor="middle" fill="url(#primaryGrad)" font-size="20" font-weight="600" letter-spacing="0.2">
      Self-Hosted Open Source Systems &amp; SaaS Booking Engines
    </text>

    <!-- Short Description -->
    <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="400">
      Automated Booking • Real-Time Calendar Sync • Multi-Provider Availability • Group Polling
    </text>

    <!-- Bottom Feature Tag Pills (Foreground) -->
    <g transform="translate(600, 275)">
      <!-- Pill 1 -->
      <g transform="translate(-310, 0)">
        <rect x="0" y="0" width="135" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>
        <text x="67" y="22" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">⚡ Cal.com &amp; Calrs</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="0" y="0" width="145" height="36" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95"/>
        <text x="72" y="22" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">📅 Easy!Appointments</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.95"/>
        <text x="65" y="22" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">🗳️ Rallly &amp; Polls</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
        <text x="82" y="22" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">🤖 AI &amp; MCP Native</text>
      </g>
    </g>
  </g>
</svg>
